<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Guruh Boshqaruvi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 15px; color: #38bdf8; font-size: 22px; }
        
        .stats { display: flex; justify-content: space-between; background: #334155; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; }
        
        .user-list { max-height: 55vh; overflow-y: auto; padding-right: 5px; }
        .user-card { background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid #38bdf8; }
        .user-info { display: flex; justify-content: space-between; font-size: 14px; }
        .username { color: #94a3b8; font-size: 12px; }
        
        .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button { padding: 6px 4px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px; transition: 0.2s; color: white; }
        
        .btn-promote { background: #10b981; }
        .btn-mute { background: #f59e0b; }
        .btn-unmute { background: #6366f1; }
        .btn-ban { background: #ef4444; }
        
        button:active { transform: scale(0.95); }
        .loading { text-align: center; color: #94a3b8; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎛 Guruh Boshqaruvi</h2>
        
        <div class="stats">
            <span>Jami foydalanuvchilar: <strong id="total-users">0</strong></span>
        </div>

        <input type="text" id="search" placeholder="Ism yoki username bo'yicha qidirish..." oninput="filterUsers()">

        <div id="loading" class="loading">Yuklanmoqda...</div>
        <div class="user-list" id="user-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ochish

        let allUsers = [];

        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                allUsers = await res.json();
                document.getElementById('loading').style.display = 'none';
                renderUsers(allUsers);
            } catch (err) {
                document.getElementById('loading').innerText = "Ma'lumotni yuklab bo'lmadi!";
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('user-list');
            document.getElementById('total-users').innerText = users.length;
            list.innerHTML = '';

            if (users.length === 0) {
                list.innerHTML = '<div class="loading">Hozircha foydalanuvchilar yo\'q. Guruhda xabar yozilishini kuting.</div>';
                return;
            }

            users.forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div class="user-info">
                        <span><b>${user.first_name} ${user.last_name || ''}</b></span>
                        <span class="username">${user.username}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-promote" onclick="sendAction('${user.chatId}', ${user.id}, 'promote')">Admin</button>
                        <button class="btn-mute" onclick="sendAction('${user.chatId}', ${user.id}, 'mute')">Mute</button>
                        <button class="btn-unmute" onclick="sendAction('${user.chatId}', ${user.id}, 'unmute')">Unmute</button>
                        <button class="btn-ban" onclick="sendAction('${user.chatId}', ${user.id}, 'ban')">Ban</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function filterUsers() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                u.first_name.toLowerCase().includes(query) || 
                u.username.toLowerCase().includes(query)
            );
            renderUsers(filtered);
        }

        async function sendAction(chatId, userId, action) {
            if (!confirm(`Haqiqatan ham bu amalni bajarmoqchimisiz? (${action})`)) return;

            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId, userId, action })
                });
                const result = await response.json();
                alert(result.message);
            } catch (err) {
                alert("Xatolik yuz berdi!");
            }
        }

        loadUsers();
    </script>
</body>
</html>
